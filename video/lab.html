<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdStack Video Lab</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0f1115;color:#eee}
.w{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:20px} textarea,select,input{width:100%;background:#1b1f27;color:#eee;border:1px solid #333;border-radius:8px;padding:8px;box-sizing:border-box;font:inherit}
textarea{min-height:170px} label{display:block;margin:12px 0 4px;font-size:13px;color:#aaa}
button{background:#7c5cff;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;margin-top:12px}
.models label{display:inline-flex;gap:6px;align-items:center;margin-right:16px;color:#eee}
.models input{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:18px}
.card{background:#1b1f27;border-radius:10px;padding:10px;font-size:13px}
video{width:100%;border-radius:8px;background:#000}
.err{color:#ff7a7a;white-space:pre-wrap;word-break:break-all}
</style></head><body><div class="w">
<h1>AdStack Video Lab — Agent Creative Vidéo</h1>
<label>1. Synthèse (texte)</label>
<textarea id="syt" style="min-height:220px" placeholder="Colle la synthèse ici (S0 à S8)"></textarea>
<label>2. Photo produit</label><input type="file" id="pr" accept="image/*">
<label>2b. Autres aspects du produit (facultatif : dos, côté, contenu, en main, détail ; 5 photos au plus)</label><input type="file" id="pr2" accept="image/*" multiple>
<label>3. CT vidéo</label><select id="cts"><option value="">chargement…</option></select>
<div id="ctinfo" style="font-size:12px;color:#8a8f99;margin-top:5px;min-height:16px"></div>
<label style="margin-top:8px">… ou un fichier CT qui n'est pas encore dans le dossier</label><input type="file" id="ct" accept=".md,.txt">
<label>Lien de la page produit du client (facultatif : sert à la page animée et au logo)</label><input id="lp" type="text" placeholder="https://…" style="width:100%">
<details style="margin-top:14px"><summary style="cursor:pointer;color:#aaa">Réglages internes (laisser tel quel)</summary>
<label>Modèle Veo</label><select id="vm"></select>
<label>Images de référence envoyées à Veo</label><select id="rm"><option value="complet">Complet : photo produit + image(s) générée(s) (le plus fidèle, le plus cher)</option><option value="produit">Photo produit seule (pas de génération d'image)</option><option value="aucune">Aucune référence (prompt seul, le moins cher)</option></select>
<label>Clips à générer</label><select id="oc"><option value="0">Les 4 clips (un par un, avec contrôle visuel)</option><option value="1-2">Clips 1 et 2 (un par un, avec contrôle visuel)</option><option value="1-3">Clips 1 à 3 (un par un, avec contrôle visuel)</option><option value="1">Clip 1 seulement</option><option value="2">Clip 2 seulement</option><option value="3">Clip 3 seulement</option><option value="4">Clip 4 seulement</option></select>
<label><input type="checkbox" id="po" style="width:auto"> Plan seulement (vérifier le script avant de dépenser sur Veo)</label>
</details>
<button onclick="runPipe()">Générer la vidéo</button>
<div id="pp" class="card" style="margin-top:14px;display:none"></div>
<p style="margin-top:30px;font-size:12px"><a style="color:#888" href="/bench.html">Comparateur de modèles Veo</a></p>
<script>
const $=id=>document.getElementById(id);
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r({data:x.result.split(',')[1],mime:f.type});x.readAsDataURL(f)});
const txt=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsText(f)});
fetch('/models').then(r=>r.json()).then(M=>{$('vm').innerHTML='<option value="auto" selected>Automatique : le répartiteur décide du modèle de chaque plan</option>'+Object.entries(M).map(([k,v],i)=>`<option value="${k}">${v.label} ($${v.usdPerSec}/s)</option>`).join('')});
let CTS=[];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ctInfo(){const c=CTS.find(x=>x.file===$('cts').value);$('ctinfo').innerHTML=c?(c.lieu?'Lieu imposé : '+esc(c.lieu)+'…':'')+'  <span style="opacity:.6">('+esc(c.file)+')</span>':''}
fetch('/cts').then(r=>r.json()).then(L=>{CTS=L;
  $('cts').innerHTML=(L.length?'':'<option value="">aucun CT dans le dossier du serveur</option>')+L.map((c,i)=>`<option value="${esc(c.file)}" ${i===0?'selected':''}>${esc(c.label)}</option>`).join('');
  ctInfo(); $('cts').onchange=ctInfo;
}).catch(()=>{$('cts').innerHTML='<option value="">liste indisponible</option>'});
function copyLog(){navigator.clipboard.writeText(JSON.stringify(window._lastP,null,1)).then(()=>alert('Journal copié : colle-le dans le chat'))}
async function runPipe(){
  const ctf=$('ct').files[0], sy=$('syt').value.trim(), prf=$('pr').files[0], ctSel=$('cts').value;
  if(!sy||!prf||(!ctf&&!ctSel)){alert('Il manque : '+[!sy&&'la synthèse',!prf&&'la photo produit',(!ctf&&!ctSel)&&'le CT'].filter(Boolean).join(', '));return}
  const ctTexte = ctf ? await txt(ctf) : await (await fetch('/ct?f='+encodeURIComponent(ctSel))).text();
  if(!ctTexte||ctTexte.length<500){alert('CT illisible ou trop court : '+(ctf?ctf.name:ctSel));return}
  const body={ct:ctTexte,synthese:sy,produit:await rd(prf),aspects:await Promise.all([...($('pr2').files||[])].slice(0,5).map(rd)),model:$('vm').value,planOnly:$('po').checked,onlyClip:$('oc').value,refMode:$('rm').value,lien_page_produit:($('lp').value||'').trim()};
  const box=$('pp'); box.style.display='block'; box.innerHTML='⏳ démarrage…';
  const r=await(await fetch('/pipeline',{method:'POST',body:JSON.stringify(body)})).json();
  if(!r.id){box.innerHTML='<div class=err>'+r.error+'</div>';return}
  const t=setInterval(async()=>{
    const s=await(await fetch('/pipe/'+r.id)).json();
    let h='<b>Étape : '+s.stage+'</b><pre style="white-space:pre-wrap">'+s.log.join('\n')+'</pre>';
    h+='<details><summary>Journal détaillé (tailles, tokens, troncature)</summary><pre style="white-space:pre-wrap">'+JSON.stringify(s.steps,null,1).replace(/</g,'&lt;')+'</pre></details>'; h+='<button onclick="copyLog()">Copier le journal complet</button> <small>(dossier local : '+s.dir+')</small>'; window._lastP=s; if(s.violations&&s.violations.length) h+='<div class=err><b>Écarts restants :</b><br>'+s.violations.join('<br>')+'</div>'; if(s.meta) h+='<details open><summary>Choix de la direction créative</summary><pre style="white-space:pre-wrap">'+JSON.stringify(s.meta,null,1)+'</pre></details>';
    if(s.plan) h+='<details><summary>Plan complet (JSON)</summary><pre style="white-space:pre-wrap">'+JSON.stringify(s.plan,null,1).replace(/</g,'&lt;')+'</pre></details>';
    if(s.refs.length) h+=s.refs.map(x=>'<img src="/video/'+x.file+'" style="width:160px;border-radius:8px;margin:4px">').join('');
    if(s.montage) h+='<div style="margin:10px 0"><b>Vidéo assemblée ('+(s.videos||[]).filter(v=>v.file).length*8+' s)</b><br><video src="/video/'+s.montage+'" controls style="width:360px;border-radius:10px"></video><br><a href="/video/'+s.montage+'?dl=1" download="'+s.montage+'" style="display:inline-block;margin-top:6px;padding:7px 14px;background:#2d6cdf;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">⬇ Télécharger la vidéo</a></div>';
    if(s.videos&&s.videos.length) h+='<div style="display:flex;flex-wrap:wrap;gap:10px">'+s.videos.map((v,i)=>'<div><b>Clip '+(i+1)+'</b><br>'+(v.file?'<video src="/video/'+v.file+'" controls playsinline style="width:200px"></video>'+(v.qa_echec?'<div class=err>Contrôle visuel : '+v.qa_echec.join(', ')+'</div>':''):(v.state==='error'?'<span class=err>'+v.error+'</span>':(v.state==='attente'?'—':'⏳ en cours…')))+'</div>').join('')+'</div>'+(s.cost?'<div>Coût estimé : $'+s.cost+'</div>':'');
    if(s.error) h+='<div class=err>'+s.error+'</div>';
    box.innerHTML=h; if(s.state!=='running') clearInterval(t);
  },4000);
}
</script></div></body></html>
